name: dotnet-web-api-startpack

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-startpack}
      POSTGRES_USER: ${POSTGRES_USER:-startpack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      # PostgreSQL 18+ uses /var/lib/postgresql/<major>/docker as PGDATA and
      # requires the persistent volume to be mounted at /var/lib/postgresql.
      - postgres18-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  mailpit:
    image: axllent/mailpit:v1.30.5
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

  api:
    image: dotnet-web-api-startpack:local
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-startpack};Username=${POSTGRES_USER:-startpack};Password=${POSTGRES_PASSWORD:-local-development-only}
      Email__Host: mailpit
      Email__Port: 1025
      Email__UseTls: "false"
      AuthCookies__RequireSecure: "false"
    ports:
      - "127.0.0.1:${API_PORT:-5035}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  postgres18-data:
