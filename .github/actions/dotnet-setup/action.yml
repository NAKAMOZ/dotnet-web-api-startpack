name: .NET setup
description: >-
  Installs the pinned SDK and restores the shared NuGet package cache. Every job needs
  this identically; the restore itself stays with the job, because the migration bundle
  restores for a specific runtime.

runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - uses: actions/cache@v5
      with:
        path: ${{ env.NUGET_PACKAGES }}
        key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', '.config/dotnet-tools.json') }}
        restore-keys: nuget-${{ runner.os }}-
