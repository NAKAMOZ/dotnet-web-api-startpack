services:
  otel-collector:
    image: otel/opentelemetry-collector:0.163.2@sha256:63e5e8eccf4268be02388ba9f2dc36b80b5e47721291293411c0e83152d75bda
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"

  api:
    environment:
      Telemetry__OtlpExporterEnabled: "true"
      Telemetry__OtlpEndpoint: "http://otel-collector:4317"
      OTEL_METRIC_EXPORT_INTERVAL: "5000"
    depends_on:
      otel-collector:
        condition: service_started
