services:
  otel-collector:
    image: otel/opentelemetry-collector:0.162.0-386@sha256:6ad380c4e403192e0be16f661c58af95d89b623dab48e6972da7c6061ad465db
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"

  api:
    environment:
      Telemetry__OtlpExporterEnabled: "true"
      Telemetry__OtlpEndpoint: "http://otel-collector:4317"
      OTEL_METRIC_EXPORT_INTERVAL: "5000"
    depends_on:
      otel-collector:
        condition: service_started
